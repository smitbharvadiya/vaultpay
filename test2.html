<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Include Stripe.js -->
    <script src="https://js.stripe.com/v3/"></script>

    <form id="payment-form">
        <div id="payment-element">
            <!-- Stripe Elements will create input elements here -->
        </div>
        <button id="submit">Pay now</button>
        <div id="error-message"></div>
    </form>

    <script>
        // Initialize Stripe
        const stripe = Stripe('pk_test_51Soc38D9E2xwLl0BIoa5SDaoFxqYnOobfUidLmdPfPLNhpX0PU161gEZRqc7nnrAuNn2l0d6CxbP0eB0ibFcwpm300G9q8BU0k');


        const clientSecret = "pi_3SprDkD9E2xwLl0B1t0Ez3LC_secret_xSlztX2hvSU47Qx52Z0279mxQ";

        // 3. Initialize Elements with the clientSecret
        const appearance = { theme: 'stripe' };
        const elements = stripe.elements({ appearance, clientSecret });

        // 4. Create and mount the Payment Element
        const paymentElementOptions = { layout: "tabs" };
        const paymentElement = elements.create("payment", paymentElementOptions);

        paymentElement.mount('#payment-element');

        // Handle form submission
        const form = document.getElementById('payment-form');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            // Create payment method and confirm payment intent
            const { error } = await stripe.confirmPayment({
                elements,
                confirmParams: {
                    return_url: 'https://example.com/order/success',
                },
            });

            if (error) {
                // Show error to your customer
                const messageElement = document.getElementById('error-message');
                messageElement.textContent = error.message;
            }
        });
    </script>
</body>

</html>
